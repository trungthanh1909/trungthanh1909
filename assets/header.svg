<svg width="900" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="45%" stop-color="#0d1527" />
      <stop offset="80%" stop-color="#14112c" />
      <stop offset="100%" stop-color="#190e2e" />
    </linearGradient>

    <!-- Accent Radial Glows -->
    <radialGradient id="glow-blue" cx="15%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-purple" cx="85%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#8957e5" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#8957e5" stop-opacity="0" />
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#388bfd" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#30363d" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8957e5" stop-opacity="0.5" />
    </linearGradient>

    <!-- Text Accent Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#bc8cff" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#58a6ff" stroke-width="0.5" stroke-opacity="0.05" />
    </pattern>
  </defs>

  <!-- Container Box with Rounded Corners -->
  <rect width="900" height="220" rx="12" fill="url(#bg-grad)" />
  <rect width="900" height="220" rx="12" fill="url(#grid)" />
  <rect width="900" height="220" rx="12" fill="url(#glow-blue)" />
  <rect width="900" height="220" rx="12" fill="url(#glow-purple)" />
  <rect x="0.5" y="0.5" width="899" height="219" rx="11.5" stroke="url(#border-grad)" stroke-width="1" />

  <!-- Subtle Futuristic Corner Accents -->
  <path d="M 12 30 L 12 12 L 30 12" stroke="#58a6ff" stroke-width="2" stroke-opacity="0.6" fill="none" />
  <path d="M 870 12 L 888 12 L 888 30" stroke="#8957e5" stroke-width="2" stroke-opacity="0.6" fill="none" />
  <path d="M 12 190 L 12 208 L 30 208" stroke="#58a6ff" stroke-width="2" stroke-opacity="0.4" fill="none" />
  <path d="M 870 208 L 888 208 L 888 190" stroke="#8957e5" stroke-width="2" stroke-opacity="0.4" fill="none" />

  <!-- Engineering Dot Matrix Decors -->
  <g fill="#58a6ff" opacity="0.25">
    <circle cx="50" cy="50" r="1.5" />
    <circle cx="65" cy="50" r="1.5" />
    <circle cx="80" cy="50" r="1.5" />
    <circle cx="50" cy="65" r="1.5" />
    <circle cx="65" cy="65" r="1.5" />
    <circle cx="80" cy="65" r="1.5" />
  </g>
  <g fill="#8957e5" opacity="0.25">
    <circle cx="820" cy="155" r="1.5" />
    <circle cx="835" cy="155" r="1.5" />
    <circle cx="850" cy="155" r="1.5" />
    <circle cx="820" cy="170" r="1.5" />
    <circle cx="835" cy="170" r="1.5" />
    <circle cx="850" cy="170" r="1.5" />
  </g>

  <!-- Content Typography -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Status / Discipline Badge -->
    <rect x="365" y="32" width="170" height="22" rx="11" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
    <circle cx="379" cy="43" r="3.5" fill="#3fb950" />
    <text x="456" y="47" font-size="11" font-weight="500" fill="#8b949e" letter-spacing="0.5">ENGINEERING PORTFOLIO</text>

    <!-- Name -->
    <text x="450" y="105" font-size="34" font-weight="700" fill="#f0f6fc" letter-spacing="-0.5">
      Nguyễn Trần Trung Thành
    </text>

    <!-- Primary Line -->
    <text x="450" y="142" font-size="16" font-weight="600" fill="url(#text-grad)" letter-spacing="0.2">
      Software Engineering · AI &amp; Backend
    </text>

    <!-- Secondary Line -->
    <text x="450" y="174" font-size="13.5" font-weight="400" fill="#8b949e" letter-spacing="0.2">
      Building reliable systems for real-world problems
    </text>
  </g>
</svg>
